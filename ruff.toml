[lint]
select = [
  "F401",  # unused-import
  "I001",  # unsorted-imports
  # docstring type
  "D211",  # blank-line-before-class
  "D213",  # multi-line-summary-second-line
  "ALL",
]
ignore = [
  # temporary
  "ANN",
  "D",
  "E501",     # line-too-long
  # needed only in large codebases
  "TD002",    # missing-todo-author
  "TD003",    # missing-todo-link
  # incompatible with other rules
  "COM812",   # missing-trailing-comma (incompatible with black)
  # disagree:
  "PD010",    # pandas-use-of-dot-pivot-or-unstack
  "PD013",    # pandas-use-of-dot-stack
  # annoying:
  "EM10",     # *-in-exception
  "RET504",   # unnecessary-assign
  "RET505",   # superfluous-else-return
  # ban something useful for a possibly good reason
  "C901",     # complex-structure
  "PLR091",   # too-many-*
  "FIX00",    # line-contains-*
  "T201",     # print
  "S101",     # assert
  "ERA001",   # commented-out-code
  "TRY003",   # raise-vanilla-args
  # specific to this repo
  "N806",     # non-lowercase-variable-in-function
  "PLR2004",  # magic-value-comparison
  "S311",     # suspicious-non-cryptographic-random-usage
  "S102",     # exec-builtin
  "G004",     # logging-f-string
  "INP001",   # implicit-namespace-package
]

[lint.extend-per-file-ignores]
"scripts/tok_eval.py" = [
  "RUF001",  # ambiguous-unicode-character-string
]
"dev/gen_synthetic_data.py" = [
  "RUF001",  # ambiguous-unicode-character-string
]
